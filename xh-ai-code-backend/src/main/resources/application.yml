spring:
  application:
    name: xh-ai-code-backend
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xh_ai_code
    username: root
    password: 888888
  # 读取配置文件
  profiles:
    active: local

server:
  port: 8123
  servlet:
    context-path: /api

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.xh.xhaicode.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
