# spring整合配置
spring:
  application:
    name: xh-ai-code-backend
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xh_ai_code
    username: root
    password: 888888
  # 读取配置文件
  profiles:
    active: local
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      ttl: 3600
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000

# 服务配置
server:
  port: 8123
  servlet:
    context-path: /api
  # cookie 30 天过期
  session:
    cookie:
      max-age: 2592000

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.xh.xhaicode.controller

# knife4j文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn
